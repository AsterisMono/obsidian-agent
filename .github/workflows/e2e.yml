name: E2E

on:
  workflow_call:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright against packaged Obsidian
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Install dependencies
        run: devenv shell -- pnpm install --frozen-lockfile
      - name: Verify bubblewrap isolation
        run: devenv shell -- bwrap --unshare-pid --unshare-ipc --ro-bind / / --proc /proc --dev /dev -- true
      - name: Run E2E tests
        run: devenv shell -- pnpm test
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artifacts
          if-no-files-found: ignore
          path: |
            /tmp/obsidian-agent-e2e-*
            /tmp/obsidian-e2e-display-*
