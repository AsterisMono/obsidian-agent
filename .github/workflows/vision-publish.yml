name: Publish vision summary

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: vision-publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Locate eligible report
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          VISION_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/vision-publish.ts --locate
      - uses: actions/download-artifact@v8
        if: steps.report.outputs.artifact-id != ''
        with:
          artifact-ids: ${{ steps.report.outputs.artifact-id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/vision-report
      - name: Update advisory summary
        if: steps.report.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VISION_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          VISION_REPORT_DIR: ${{ runner.temp }}/vision-report
        run: node scripts/vision-publish.ts
