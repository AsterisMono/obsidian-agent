name: Regular checks

on:
  workflow_call:
  workflow_dispatch:

jobs:
  regular:
    name: Formatting, lint, and types
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Install dependencies
        run: devenv shell -- pnpm install --frozen-lockfile
      - name: Run checks
        run: devenv shell -- pnpm run check:regular
      - name: Check vision runner safeguards
        run: devenv shell -- pnpm test:vision
