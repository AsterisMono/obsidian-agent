name: Vision

on:
  workflow_call:
    secrets:
      OPENCODE_API_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vision:
    name: Agent-driven visual check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        timeout-minutes: 5
        run: nix profile add nixpkgs#devenv
      - name: Install dependencies
        timeout-minutes: 12
        run: devenv shell -- pnpm install --frozen-lockfile
      - name: Verify bubblewrap isolation
        run: devenv shell -- bwrap --unshare-pid --unshare-ipc --ro-bind / / --proc /proc --dev /dev -- true
      - name: Build plugin
        timeout-minutes: 3
        run: devenv shell -- pnpm run build
      # An agent drives the session through screenshots and coordinate input, the same
      # way an operator would, and records a verdict instead of diffing fixed images.
      - name: Run vision agent
        timeout-minutes: 22
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          VISION_OUT_DIR: /tmp/obsidian-vision-run
          VISION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VISION_MODEL: deepseek-v4.1-flash
          VISION_THINKING: xhigh
        run: |
          set -o pipefail
          devenv shell -- pnpm vision | tee /tmp/vision-result.jsonl
      - name: Upload vision evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vision-evidence-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            /tmp/vision-result.jsonl
            /tmp/obsidian-vision-run
            /tmp/obsidian-e2e-display-*
            /tmp/obsidian-agent-e2e-*
      - name: Upload structured report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vision-report-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: /tmp/obsidian-vision-run/report.json
