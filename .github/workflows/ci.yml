name: CI

on:
  push:
    branches: [main]
  # Every pull request, whichever branch it targets.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regular:
    name: Regular checks
    uses: ./.github/workflows/regular.yml

  lean:
    name: Lean
    needs: regular
    uses: ./.github/workflows/lean.yml

  e2e:
    name: E2E
    needs: regular
    uses: ./.github/workflows/e2e.yml

  vision:
    name: Vision
    needs: [regular, lean, e2e]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/vision.yml
    secrets: inherit
